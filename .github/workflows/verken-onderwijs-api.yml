name: Verkenning Onderwijs-API's

# Eenmalige verkenning (oktober 2026): welke API's en open bronnen van Onderwijs en Vorming kunnen
# de matrix van de studierichtingen secundair onderwijs leveren, en wat zit er verder in? Alleen met
# de hand te starten. Bewaart geen gegevens in de repository: het verslag staat in het logboek, in
# de samenvatting en als artifact. Script en uitleg: tools/verkenning/verken-onderwijs-api.mjs.
#
# De API-sleutel is hetzelfde geheim als bij de minimumdoelen (ONDERWIJSDOELEN_API_KEY). Hij gaat
# alleen naar onderwijs.api.vlaanderen.be, staat enkel in de omgeving van de stap met sleutel, en komt
# nooit in een log of in het verslag.
#
# Stand "matrix" (standaard, ronde 3): alleen de matrix van de studierichtingen (één regel per
# studierichting), de filters van de doelen-API en de parameternamen uit de webapps. Zo blijft het
# logboek onder de 5000 regels die de GitHub-koppeling van de cloudsessie kan teruglezen.
# Stand "koppeling" (ronde 4): per studierichting welke doelensets de doelen-API teruggeeft.
# Stand "proeven" (ronde 5): filters van de doelen-API (groepsnummer, graad, stroom, geldigheid).
# Stand "kwalificaties" (ronde 6): hoe een studierichting aan beroepskwalificaties (BK-...) vastzit.
# Hoogstens 60 oproepen; de logboekregels beginnen met KWAL| en KWAL-SAMENVATTING|.
# Stand "volledig": de brede verkenning van ronde 1 en 2 met het verslag.

on:
  workflow_dispatch:
    inputs:
      stand:
        description: 'Wat verkennen'
        required: false
        default: matrix
        type: choice
        options:
          - matrix
          - koppeling
          - proeven
          - kwalificaties
          - volledig

permissions:
  contents: read

concurrency:
  group: verken-onderwijs-api
  cancel-in-progress: false

jobs:
  verkennen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Zoals bij de minimumdoelen: de stap met het geheim draait vóór de installatie van de
      # npm-pakketten en gebruikt alleen ingebouwde Node-modules.
      - name: Matrix en filters (met sleutel)
        if: inputs.stand == 'matrix' || inputs.stand == ''
        env:
          ONDERWIJSDOELEN_API_KEY: ${{ secrets.ONDERWIJSDOELEN_API_KEY }}
        run: node tools/verkenning/verken-onderwijs-api.mjs --matrix

      - name: Koppeling studierichting en doelen (met sleutel)
        if: inputs.stand == 'koppeling'
        env:
          ONDERWIJSDOELEN_API_KEY: ${{ secrets.ONDERWIJSDOELEN_API_KEY }}
        run: node tools/verkenning/verken-onderwijs-api.mjs --koppeling

      - name: Filterproeven (met sleutel)
        if: inputs.stand == 'proeven'
        env:
          ONDERWIJSDOELEN_API_KEY: ${{ secrets.ONDERWIJSDOELEN_API_KEY }}
        run: node tools/verkenning/verken-onderwijs-api.mjs --proeven

      - name: Beroepskwalificaties en koppelingen (met sleutel)
        if: inputs.stand == 'kwalificaties'
        env:
          ONDERWIJSDOELEN_API_KEY: ${{ secrets.ONDERWIJSDOELEN_API_KEY }}
        run: node tools/verkenning/verken-onderwijs-api.mjs --kwalificaties

      - name: Parameternamen uit de webapps (zonder sleutel)
        if: always() && inputs.stand != 'volledig' && inputs.stand != 'proeven' && inputs.stand != 'kwalificaties'
        continue-on-error: true
        run: node tools/verkenning/verken-onderwijs-api.mjs --parameters

      - name: Proefoproepen met sleutel
        if: inputs.stand == 'volledig'
        continue-on-error: true
        env:
          ONDERWIJSDOELEN_API_KEY: ${{ secrets.ONDERWIJSDOELEN_API_KEY }}
        run: node tools/verkenning/verken-onderwijs-api.mjs --met-sleutel

      - name: Pakketten installeren
        if: always() && inputs.stand == 'volledig'
        run: npm ci --ignore-scripts

      - name: Publieke bronnen zonder sleutel
        if: always() && inputs.stand == 'volledig'
        continue-on-error: true
        run: node tools/verkenning/verken-onderwijs-api.mjs --publiek

      - name: Verslag
        if: always() && inputs.stand == 'volledig'
        run: node tools/verkenning/verken-onderwijs-api.mjs --verslag

      - name: Verslag bewaren
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verkenning-onderwijs-api
          path: tools/verkenning/rapport/
          if-no-files-found: ignore
          retention-days: 30
