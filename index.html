<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Boosterz — geef je les een boost: interactieve oefeningen, spelletjes en digitale cursussen voor je klas, met AI-hulp vanuit je eigen bronmateriaal." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#5b3df5" />
    <title>Boosterz — geef je les een boost</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b3df5'/%3E%3Cstop offset='1' stop-color='%23ff6a2a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='92' height='92' rx='24' fill='url(%23g)'/%3E%3Cpath d='M57 14 L26 56 H47 L42 86 L74 42 H53 Z' fill='%23fff' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- De lettertypes staan in de app zelf (src/styles/global.css, @font-face):
         geen verbinding met Google, en ze werken offline. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Bij de build komt direct na <meta charset> een beveiligingsbeleid dat
         alleen eigen scripts toelaat; het vangnet hieronder mag via zijn hash.
         Geen inline onload= of onclick= in dit bestand: de build weigert ze.
         Zie src/offline/csp.ts. -->
    <script>
      // Vangnet vóór de app start. Laadt de hoofdbundel niet (geen netwerk en
      // nog niet bewaard op dit toestel, of de verbinding viel weg tijdens het
      // laden), dan een rustige melding in plaats van een leeg scherm. Start de
      // app wel, dan vervangt ze deze inhoud. Zie src/offline/.
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (!el || el.tagName !== 'SCRIPT' || !/\/assets\//.test(el.src || '')) return;
        var root = document.getElementById('root');
        if (!root || root.firstChild) return;
        root.innerHTML =
          '<main style="min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box;font-family:system-ui,sans-serif;text-align:center">' +
          '<div style="max-width:440px"><h1 style="font-size:1.3rem">Boosterz kon niet laden</h1>' +
          '<p>Er is geen verbinding, of ze viel weg tijdens het laden. Je antwoorden en materiaal blijven bewaard op dit toestel.</p>' +
          '<button type="button" style="font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:0;background:#5b3df5;color:#fff;cursor:pointer">Opnieuw proberen</button>' +
          '<p role="status" aria-live="polite"></p></div></main>';
        root.querySelector('button').addEventListener('click', function () {
          var sw = navigator.serviceWorker;
          // Zonder netwerk en zonder service worker toont herladen de foutpagina van de browser.
          if (navigator.onLine === false && !(sw && sw.controller)) {
            root.querySelector('[role=status]').textContent = 'Nog altijd geen verbinding. Probeer het zo meteen opnieuw.';
            return;
          }
          location.reload();
        });
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
